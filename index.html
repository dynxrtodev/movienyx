<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movienyx Beta</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🎬 Movienyx Beta</h1>
    <p>Nonton Gratis Jalur Scrape</p>
    
    <div class="search-container" style="margin-top: 15px;">
      <input type="text" id="searchInput" placeholder="Cari film atau series..." 
             style="padding: 8px; width: 60%; max-width: 300px; border-radius: 4px; border: none;">
      <button id="searchBtn" 
              style="padding: 8px 15px; background: #e50914; color: white; border: none; border-radius: 4px; cursor: pointer;">
        Cari
      </button>
    </div>
  </header>

  <!-- Tempat di mana poster film bakal muncul -->
  <main id="movie-grid" class="grid"></main>

  <!-- Pemanggil script yang hilang -->
  <script src="app.js"></script>
</body>
</html>
