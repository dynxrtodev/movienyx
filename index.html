<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0809">
  <script>try{if(sessionStorage.getItem('mn_splash'))document.documentElement.classList.add('no-splash')}catch(e){}</script>
  <title>Movienyx Beta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="has-dock">
  <div id="splash" aria-hidden="true"><div class="sp-curtain l"></div><div class="sp-curtain r"></div><div class="sp-logo">Movienyx</div><div class="sp-load"><i></i></div></div>

  <header class="nav" id="nav">
    <a class="logo" href="index.html" aria-label="Movienyx, ke beranda"><span>Movienyx</span></a>
    <form class="search" id="searchForm" role="search">
      <button type="submit" id="searchBtn" aria-label="Cari"><i data-lucide="search" aria-hidden="true"></i></button>
      <input id="searchInput" type="search" placeholder="Cari tontonan..." autocomplete="off" aria-label="Cari tontonan">
    </form>
    <a class="navlink" href="history.html" aria-label="Riwayat tontonan"><i data-lucide="history" aria-hidden="true"></i><span>Riwayat</span></a>
  </header>

  <main id="app" aria-live="polite"></main>

  <footer>Movienyx Beta &middot; Nonton Movie Ternyaman Dan Teraman!</footer>

  <!-- Navigasi kategori (bawah) -->
  <nav class="dock" id="catTabs" data-active="movie" aria-label="Kategori">
    <span class="dock-ind" aria-hidden="true"></span>
    <button class="cat-btn active" data-type="movie"><i data-lucide="film" aria-hidden="true"></i><span>Film &amp; Series</span></button>
    <button class="cat-btn" data-type="anime"><i data-lucide="swords" aria-hidden="true"></i><span>Anime</span></button>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <script src="ui.js"></script>
  <script src="app.js"></script>
</body>
</html>
